# Bio as shown on the old home page (Markdown).
bio: |
  I work on how large language models reason, supervised by [Akhil Arora](https://au-clan.github.io/people/aarora/) and [Lars Klein](https://www.linkedin.com/in/lars-henning-klein/). My aim is to make that reasoning, as Daft Punk would put it, *harder, better, faster, stronger*. Before Aarhus I studied electrical engineering and then data science at [EPFL](https://www.epfl.ch/), where my master's thesis at [DLAB](https://dlab.epfl.ch/) became *Fleet of Agents*.
